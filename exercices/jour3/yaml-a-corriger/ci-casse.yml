# Workflow CI de TaskFlow — VERSION CASSÉE (exercice 3.1)
# GitHub refuse ce fichier : « Invalid workflow file ». Trouvez et corrigez les erreurs.
name: CI

on:
  push:
    branches: [main]
  pull_request

jobs:
  api:
    runs-on ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
           cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
	  - run: npm test

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer, tester, construire
        run:
          npm ci
          npm test
          npm run build
