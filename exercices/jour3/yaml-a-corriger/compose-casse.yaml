# compose.yaml de TaskFlow — VERSION CASSÉE (exercice 3.1)
# « docker compose config » refuse ce fichier. Trouvez et corrigez les erreurs.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    ports:
    - 3000:3000
    environment:
      - DATABASE_URL=postgres://taskflow:taskflow@db:5432/taskflow
      APP_ENV: local
    depends_on:
      - db

   front:
    build: ./front
    ports:
      - "8080:80"
    depends_on: api

volume:
  pgdata:
