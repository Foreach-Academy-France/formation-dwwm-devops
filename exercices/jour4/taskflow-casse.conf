# =============================================================================
# deploy/nginx/taskflow.conf — VERSION CASSÉE (exercice 4.1)
# Configuration du conteneur « proxy » (nginx:1.27-alpine) de la stack taskflow-prod.
# Le conteneur monte :
#   ./nginx/taskflow.conf  → /etc/nginx/conf.d/default.conf
#   ./certs/               → /etc/nginx/certs/   (taskflow.crt + taskflow.key)
# Ce fichier contient 6 problèmes. Trouvez-les et corrigez-les.
# =============================================================================

server {
    listen 80;
    server_name taskflow.localhost;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/ssl/certs/taskflow.crt;
    ssl_certificate_key /etc/nginx/certs/taskflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
