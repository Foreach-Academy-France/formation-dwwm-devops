name: Deploy Slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Slides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Marp CLI
        run: bun add -g @marp-team/marp-cli

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended fonts-noto-color-emoji

      - name: Create output directories
        run: |
          mkdir -p public/slides
          mkdir -p public/pdf
          mkdir -p public/tp-pdf

      - name: Build HTML slides
        run: |
          for slide in slides/*.md; do
            echo "Building $(basename $slide)..."
            marp "$slide" --html --allow-local-files -o "public/slides/$(basename $slide .md).html"
          done

      - name: Build PDF slides
        run: |
          for slide in slides/*.md; do
            echo "Building PDF for $(basename $slide)..."
            marp "$slide" --html --allow-local-files --pdf -o "public/pdf/$(basename $slide .md).pdf"
          done

      - name: Build TP & exercices PDFs
        run: |
          # Un PDF par énoncé : TP0, TP1, étapes du fil rouge, exercices de chaque jour
          # (les fichiers de solutions ne sont pas convertis en PDF).
          for doc in tp/README.md tp/tp*/README.md tp/fil-rouge-taskflow/README.md tp/fil-rouge-taskflow/etape*.md \
                     exercices/jour*/*.md ressources/cheatsheet-*.md ressources/setup-poste.md evaluation/mise-en-situation.md; do
            [ -f "$doc" ] || continue
            case "$doc" in *solution*) continue ;; esac
            case "$doc" in
              tp/README.md)                    name="tp-overview" ;;
              tp/fil-rouge-taskflow/README.md) name="fil-rouge-taskflow" ;;
              */README.md)                     name="$(basename "$(dirname "$doc")")" ;;
              exercices/*)                     name="exercices-$(basename "$(dirname "$doc")")-$(basename "$doc" .md)" ;;
              *)                               name="$(basename "$doc" .md)" ;;
            esac
            echo "Generating PDF for $doc -> $name.pdf ..."
            pandoc "$doc" \
              -o "public/tp-pdf/${name}.pdf" \
              --pdf-engine=xelatex \
              --resource-path="$(dirname "$doc")" \
              -V geometry:margin=2cm \
              -V documentclass=article \
              -V fontsize=11pt \
              -V mainfont="DejaVu Sans" \
              -V monofont="DejaVu Sans Mono" \
              -V colorlinks=true \
              --toc \
              --highlight-style=tango || echo "::warning::PDF failed for $doc"
          done

      - name: Copy additional files
        run: |
          # NB : evaluation/qcm-corrige.md est gitignoré → absent du checkout → jamais publié
          for dir in tp exercices evaluation ressources demos; do
            [ -d "$dir" ] && cp -r "$dir" public/
          done
          cp README.md plan-cours.md public/
          # Images des slides (référencées en relatif depuis public/slides/*.html)
          [ -d slides/img ] && cp -r slides/img public/slides/

      - name: Create index.html
        run: |
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Formation DWWM DevOps | ForEach Academy</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      line-height: 1.6; color: #333;
                      background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
                      min-height: 100vh; padding: 2rem 1rem;
                  }
                  .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; padding: 3rem 2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
                  header { text-align: center; margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 3px solid #2563eb; }
                  h1 { color: #2563eb; font-size: 2.5rem; margin-bottom: 0.5rem; }
                  .icon { font-size: 3rem; margin-bottom: 1rem; }
                  .subtitle { color: #666; font-size: 1.2rem; }
                  .info { background: #f7f7f7; padding: 1.5rem; border-radius: 10px; margin: 2rem 0; }
                  .info p { margin: 0.5rem 0; }
                  .section { margin: 2rem 0; }
                  .section h2 { color: #1e3a8a; margin-bottom: 1rem; font-size: 1.8rem; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
                  .card { background: #fff; border: 2px solid #e0e0e0; border-radius: 10px; padding: 1.5rem; transition: all 0.3s ease; }
                  .card:hover { border-color: #2563eb; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2); }
