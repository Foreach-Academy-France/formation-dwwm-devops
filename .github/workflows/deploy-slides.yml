                  .btn { display: inline-block; padding: 0.5rem 1rem; background: #2563eb; color: white; text-decoration: none; border-radius: 5px; font-size: 0.9rem; transition: background 0.3s ease; }
                  .btn:hover { background: #1e3a8a; }
