                  .chain { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin: 1.5rem 0; font-weight: bold; color: #1e3a8a; }
                  .chain span { background: #eff6ff; border: 1px solid #2563eb; padding: 0.4rem 0.9rem; border-radius: 20px; }
