# « Cible » de démonstration : imite le GET /health de l'API TaskFlow
server {
    listen 80;
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","db":"up","version":"demo","env":"demo"}';
    }
    location / {
        default_type text/plain;
        return 200 "Cible de démo Uptime Kuma\n";
    }
}
