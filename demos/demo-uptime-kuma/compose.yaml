# =============================================================================
# Démo J4 — Bloc 6.1 : Uptime Kuma (supervision simple) + une cible de démo
#   docker compose up -d   →   http://localhost:3001   (Uptime Kuma)
#                              http://localhost:8088/health   (cible)
# =============================================================================
name: demo-uptime-kuma

services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:1.23.16
    ports:
      - "${KUMA_PORT:-3001}:3001"
    volumes:
      - kuma-data:/app/data              # comptes, sondes, historique : à conserver
    extra_hosts:
      # Permet de joindre un service publié sur le poste (ex. la prod TaskFlow en HTTPS)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  cible:                                 # imite /health de l'API TaskFlow ; on la coupera en direct
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${CIBLE_PORT:-8088}:80"
    volumes:
      - ./cible/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  kuma-data:
